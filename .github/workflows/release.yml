name: Release

# release-please keeps a "release X.Y.Z" PR open that bumps manifest.json and
# CHANGELOG.md from the conventional commits on main. Merging that PR tags
# X.Y.Z and publishes the release Obsidian installs from.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp

      - uses: actions/checkout@v7
        if: steps.rp.outputs.release_created

      - name: Attach theme files
        if: steps.rp.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: gh release upload "$TAG" theme.css manifest.json --clobber

      # PRs opened with GITHUB_TOKEN don't trigger workflows, so run CI on the
      # release PR by hand; otherwise its required checks never report.
      - name: Run CI on the release PR
        if: steps.rp.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
