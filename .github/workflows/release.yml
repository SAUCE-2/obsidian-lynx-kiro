name: Release

# All work lands on dev. release-please keeps a "release X.Y.Z" PR open against
# dev that bumps manifest.json and CHANGELOG.md from the conventional commits
# since the last release. Merging that PR tags X.Y.Z, publishes the release
# Obsidian installs from, and fast-forwards main to the release commit, so
# main and dev share one linear history.
on:
  push:
    branches: [dev]
  # Fast-forwards main to dev without a release (e.g. docs-only changes).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          target-branch: dev

      - uses: actions/checkout@v7
        if: steps.rp.outputs.release_created

      - name: Attach theme files
        if: steps.rp.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: gh release upload "$TAG" theme.css manifest.json --clobber

      # PRs opened with GITHUB_TOKEN don't trigger workflows, so run CI on the
      # release PR by hand; otherwise its required checks never report.
      - name: Run CI on the release PR
        if: steps.rp.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  fast-forward-main:
    needs: release-please
    if: needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN can't bypass the "Protect main" ruleset; this deploy key can.
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          ssh-key: ${{ secrets.MAIN_DEPLOY_KEY }}

      # A plain push only fast-forwards: if main ever has commits dev lacks,
      # this fails instead of rewriting main.
      - name: Fast-forward main
        env:
          SHA: ${{ needs.release-please.outputs.sha || github.sha }}
        run: git push origin "$SHA:refs/heads/main"
