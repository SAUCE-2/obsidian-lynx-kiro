name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check manifest.json
        run: |
          jq -e '
            (.name | type == "string" and length > 0) and
            (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) and
            (.minAppVersion | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.author | type == "string" and length > 0)
          ' manifest.json

      # release-please owns the version; a hand edit would desync it from
      # CHANGELOG.md and .release-please-manifest.json.
      - name: Check version isn't bumped by hand
        if: >-
          github.event_name == 'pull_request' &&
          !(startsWith(github.head_ref, 'release-please--') &&
            github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          old=$(git show FETCH_HEAD:manifest.json | jq -r .version)
          new=$(jq -r .version manifest.json)
          if [ "$old" != "$new" ]; then
            echo "::error file=manifest.json::Don't change version by hand ($old -> $new). release-please bumps it from PR titles: fix: = patch, feat: = minor, feat!: = major."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint theme.css
        run: npx --yes stylelint@16 theme.css

  # PRs are squash-merged with the PR title as the commit message, so the
  # title is what release-please reads. Skipped (which passes) outside PRs.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title must be a conventional commit, e.g. 'fix: callout title contrast' or 'feat(canvas): style group labels'. Got: $TITLE"
            exit 1
          fi
