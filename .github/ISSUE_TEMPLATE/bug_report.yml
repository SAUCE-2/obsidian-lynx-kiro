name: Bug report
description: Something looks wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: What you see, and what you expected. Screenshots help a lot.
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version
      placeholder: "1.7.7"
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Theme version
      placeholder: "1.1.0"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
  - type: textarea
    id: plugins
    attributes:
      label: Plugins or snippets involved
      description: If the issue only shows up with a plugin or CSS snippet, name it.
